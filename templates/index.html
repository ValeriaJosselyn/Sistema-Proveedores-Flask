<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proveedores</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

<link rel="manifest" href="/static/manifest.json">

<style>

body{

    background:#F8F3FB;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;

}


.contenedor{

    background:white;
    width:420px;
    padding:45px;
    border-radius:25px;
    text-align:center;

    box-shadow:
    0 8px 25px rgba(155,89,182,.35);

}


h1{

    color:#9B59B6;
    font-size:48px;
    margin-bottom:10px;

}


.subtitulo{

    color:#777;
    margin-bottom:35px;
    font-size:18px;

}


.btn-consultar{

    background:#9B59B6;
    color:white;

    padding:18px;

    border-radius:30px;
    border:none;

    width:100%;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}


.btn-consultar:hover{

    background:#8E44AD;

    transform:scale(1.03);

}



.formulario{

    display:none;
    margin-top:25px;

}


input{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:2px solid #E8DAEF;

    margin-bottom:20px;

    font-size:16px;

}



.entrar{

    background:#8E44AD;

    color:white;

    border:none;

    padding:14px;

    width:100%;

    border-radius:25px;

    font-size:17px;

    cursor:pointer;

    transition:.3s;

}


.entrar:hover{

    background:#6C3483;

}



</style>

</head>


<body>


<div class="contenedor">


<h1>Bienvenidos</h1>


<p class="subtitulo">

Sistema de Proveedores

</p>



<button 
class="btn-consultar" 
onclick="mostrarFormulario()">

 Consultar proveedores

</button>




<form 
class="formulario"
id="formulario"
method="POST"
action="{{ url_for('inicio') }}">


<input

type="text"

name="usuario"

placeholder="Usuario del administrador"

required>



<button class="entrar">

Entrar

</button>



</form>



</div>



<script>


function mostrarFormulario(){

document.getElementById("formulario").style.display="block";

}


</script>


</body>

</html>
