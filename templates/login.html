<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/login.css') }}">

</head>


<body>


<div class="login">


<h1>Iniciar Sesión</h1>



<form action="/validar_login" method="POST">


<input
type="text"
name="usuario"
placeholder="Usuario"
required>


<input
type="password"
name="contrasena"
placeholder="Contraseña"
required>



<button>

Ingresar

</button>


</form>



<a href="{{ url_for('restablecer_contrasena') }}" class="restablecer">

Reestablecer contraseña

</a>



</div>


</body>

</html>
