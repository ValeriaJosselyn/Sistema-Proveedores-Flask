
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Editar factura | Sistema de Proveedores</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/panel.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/recordatorios.css') }}">
</head>

<body class="pagina-editar">

    <main class="contenedor-editar">

        <section class="caja seccion-pagos">

            <div class="seccion-encabezado">

                <div>
                    <h1>Editar recordatorio </h1>

                    <p>
                        Modifica los datos de la factura
                        seleccionada.
                    </p>
                </div>

            </div>

            {% if error %}
            <div class="alerta-error" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST"
                  class="formulario-pagos">

                <input type="hidden"
                       name="csrf_token"
                       value="{{ csrf_token | default('') }}">

                <div class="campo-pago">

                    <label for="id_proveedor">
                        Proveedor
                    </label>

                    <select id="id_proveedor"
                            name="id_proveedor"
                            required>

                        {% for proveedor in proveedores %}

                        <option value="{{ proveedor.id }}"
                            {% if proveedor.id == pago.id_proveedor %}
                                selected
                            {% endif %}>

                            {{ proveedor.nombre_proveedor }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="campo-pago">

                    <label for="numero_factura">
                        Número de factura
                    </label>

                    <input type="text"
                           id="numero_factura"
                           name="numero_factura"
                           maxlength="100"
                           value="{{ pago.numero_factura }}"
                           required>

                </div>

                <div class="campo-pago">

                    <label for="monto">
                        Monto (MXN)
                    </label>

                    <input type="number"
                           id="monto"
                           name="monto"
                           min="0"
                           max="9999999999.99"
                           step="0.01"
                           value="{{ pago.monto }}"
                           required>

                </div>

                <div class="campo-pago">

                    <label for="fecha_vencimiento">
                        Fecha de vencimiento
                    </label>

                    <input type="date"
                           id="fecha_vencimiento"
                           name="fecha_vencimiento"
                           value="{{ pago.fecha_vencimiento.isoformat() }}"
                           required>

                </div>

                <div class="acciones-formulario">

                    <button type="submit"
                            class="boton-guardar">
                        Guardar cambios
                    </button>

                    <a href="{{ url_for('recordatorios') }}"
                       class="boton-cancelar">
                        Cancelar
                    </a>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
