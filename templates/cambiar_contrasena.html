<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#FBF7FF;
            font-family:Arial, Helvetica, sans-serif;
        }

        .form-contenedor{

            width:420px;

            margin:auto;

            margin-top:70px;

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:0 8px 25px rgba(123,44,191,.20);

        }

        h2{

            color:#7B2CBF;

            text-align:center;

            margin-bottom:10px;

            font-size:28px;

        }

        .subtitulo{

            text-align:center;

            color:#777;

            margin-bottom:30px;

            font-size:15px;

        }

        .campo{

            margin-bottom:20px;

        }

        label{

            display:block;

            margin-bottom:8px;

            color:#555;

            font-weight:bold;

            font-size:14px;

        }

        input{

            width:100%;

            padding:12px;

            border:2px solid #E9D8FD;

            border-radius:12px;

            font-size:15px;

            transition:.3s;

            outline:none;

        }

        input:focus{

            border-color:#9C4DCC;

            box-shadow:0 0 10px rgba(156,77,204,.25);

        }

        /* ALERTAS */

        .alert{

            padding:12px;

            border-radius:10px;

            margin-bottom:20px;

            font-size:14px;

            text-align:center;

            font-weight:bold;

        }

        .alert-error{

            background:#FFE5EC;

            color:#C2185B;

        }

        .alert-exito{

            background:#F0E5FF;

            color:#6A1B9A;

        }

        /* BOTONES */

        .botones{

            display:flex;

            gap:15px;

            margin-top:30px;

        }

        button,
        .btn-cancelar{

            width:50%;

            padding:13px;

            border-radius:25px;

            font-size:15px;

            font-weight:bold;

            cursor:pointer;

            text-align:center;

            text-decoration:none;

            transition:.3s;

        }

        button{

            background:#9C4DCC;

            color:white;

            border:none;

        }

        button:hover{

            background:#7B2CBF;

            transform:scale(1.03);

        }

        .btn-cancelar{

            background:#F1E7FF;

            color:#7B2CBF;

            border:2px solid #D8B4FE;

        }

        .btn-cancelar:hover{

            background:#D8B4FE;

            color:white;

            transform:scale(1.03);

        }

    </style>

</head>

<body>

    <div class="form-contenedor">

        <h2>Cambiar Contraseña</h2>

        <p class="subtitulo">
            Actualiza tu contraseña de forma segura.
        </p>

        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}

        {% if exito %}
        <div class="alert alert-exito">
            {{ exito }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="campo">
                <label>Contraseña Actual</label>
                <input type="password" name="actual" required>
            </div>

            <div class="campo">
                <label>Nueva Contraseña</label>
                <input type="password" name="nueva" required>
            </div>

            <div class="campo">
                <label>Confirmar Nueva Contraseña</label>
                <input type="password" name="confirmar" required>
            </div>

            <div class="botones">

                <button type="submit">
                    Actualizar
                </button>

                <a href="/panel" class="btn-cancelar">
                    Volver
                </a>

            </div>

        </form>

    </div>

</body>

</html>
